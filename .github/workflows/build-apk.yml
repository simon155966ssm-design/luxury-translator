
name: Build Luxury Translator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract version 0.2 source
        run: unzip -o LuxuryTranslator_0.2.0_OCR.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: LuxuryTranslator
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxuryTranslator-0.2.0-debug-apk
          path: LuxuryTranslator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
